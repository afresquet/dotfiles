name: Poke issue agent

# Hands an issue to home-server's issue agent when you label it `agent`, or
# comment on one that already is (e.g. to steer its next attempt). Issues the
# workflows open poke the agent themselves: events made with the default
# token don't trigger workflows, this one included.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  poke:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent')
      || (github.event_name == 'issue_comment'
          && !github.event.issue.pull_request
          && contains(github.event.issue.labels.*.name, 'agent')
          && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/poke-agent
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          url: ${{ vars.AGENT_POKE_URL }}
