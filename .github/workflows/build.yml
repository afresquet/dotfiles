name: Build

# Builds, each on its native platform, the NixOS, nix-darwin and
# home-manager configurations whose derivation this change alters
# (scripts/build-matrix.sh --changed-since), and nothing when none does.
# Runs:
# - on every push to main, against the commit before it; it is already on
#   main by then, so a failure is reported as a "Lock build failed" issue
#   and Telegram message rather than blocked;
# - on every pull request, against the base branch. Only the matrix is
#   evaluated: the builds wait on the `build` environment, whose required
#   reviewer starts them with "Review deployments" on the PR. Not a
#   required check, so it never blocks merging;
# - when flake-update calls it with its candidate update (against main
#   without it), which it commits only if this passes.
# Builds from main and flake-update are pushed to Cachix, which every host
# substitutes from (modules/nix/cachix.nix); a pull request's never are, so
# unmerged code doesn't reach the cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      patch:
        description: Candidate update to build, as a git diff (see setup-nix).
        type: string
        default: ""

# A new push to a pull request supersedes the builds still waiting for
# approval on the previous one.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix
        with:
          patch: ${{ inputs.patch }}

      - name: Build matrix
        id: matrix
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "${{ github.event_name }}" in
            push) base=$BEFORE ;;
            # The PR's merge commit, whose first parent is the base branch.
            pull_request) base=HEAD^1 ;;
            # Called by flake-update: main, without the candidate patch.
            *) base=HEAD ;;
          esac
          matrix=$(.github/scripts/build-matrix.sh --changed-since "$base")
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.include != []' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.event_name == 'pull_request' && 'build' || '' }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/lib/android
          docker system prune -af || true
          df -h /

      - uses: ./.github/actions/setup-nix
        with:
          patch: ${{ inputs.patch }}

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-out-paths '${{ matrix.installable }}')
          echo "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # Hosts pick these up through their auto-upgrade or a rebuild, so the
      # closure is downloaded rather than rebuilt. Skipped until the
      # CACHIX_CACHE variable and CACHIX_AUTH_TOKEN secret are set. Only the
      # paths no other substituter in setup-nix serves are pushed (see
      # cachix-push.sh). Never from a pull request: its code isn't merged.
      - name: Push to Cachix
        if: vars.CACHIX_CACHE != '' && github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: .github/scripts/cachix-push.sh '${{ vars.CACHIX_CACHE }}' '${{ steps.build.outputs.out }}'

  # Only for pushes to main: when called, flake-update reports on the whole
  # run, and a pull request's result shows on the PR.
  report:
    needs: [matrix, build]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.matrix.result != 'success' || needs.matrix.outputs.any == 'true')
    runs-on: ubuntu-24.04
    permissions:
      actions: read # list which jobs failed
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          title="Lock build failed"
          if [ "$FAILED" != true ]; then
            .github/scripts/notify.sh close "$title" "Fixed: $RUN_URL"
            exit 0
          fi
          failed=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)"')
          issue=$(printf 'Run: %s\n\nmain (%s) failed to build:\n%s\n' \
            "$RUN_URL" "${{ github.sha }}" "$failed" | .github/scripts/notify.sh issue "$title")
          .github/scripts/notify.sh telegram "$(printf '❌ %s main failed to build\nRun: %s\nIssue: %s' "$GH_REPO" "$RUN_URL" "$issue")"
