name: Flake update

# Weekly (or on demand) `nix flake update`, gated on the Check and Build
# workflows passing on the new lock: flake.lock is committed to main only
# when it checks and every configuration builds. Any failure pushes the
# candidate lock to the `flake-update` branch, opens (or comments on) a
# "Flake update failed" issue pointing at it and, if the TELEGRAM_* secrets
# are set, messages Telegram. Committing with the default token doesn't
# trigger other workflows, so the lock isn't checked or built twice.

on:
  schedule:
    # Saturdays 04:00 UTC. Hosts check every few hours whether main's
    # flake.lock changed (pkgs/upgrade-pending.nix), so a late commit or a
    # manual rerun after a failure deploys without waiting a week.
    - cron: "0 4 * * 6"
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      lock: ${{ steps.update.outputs.lock }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat flake.lock
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Hand the exact bytes to the check and build jobs; flake.lock has
          # no line that could collide with the delimiter.
          {
            echo "lock<<FLAKE_LOCK_EOF"
            cat flake.lock
            echo "FLAKE_LOCK_EOF"
          } >> "$GITHUB_OUTPUT"

  # A called workflow's token can only have what the caller grants, even for
  # jobs that skip themselves when called (Check's warnings report, Build's
  # push report), so these grant what those declare.
  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/check.yml
    with:
      lock: ${{ needs.update.outputs.lock }}
    secrets: inherit

  build:
    needs: [update, check]
    if: needs.update.outputs.changed == 'true'
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/build.yml
    with:
      lock: ${{ needs.update.outputs.lock }}
    secrets: inherit

  commit:
    needs: [update, check, build]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # Commit on top of the current main rather than the SHA that was tested:
      # only flake.lock changes, and the run can take hours.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Commit flake.lock
        id: commit
        env:
          LOCK: ${{ needs.update.outputs.lock }}
          BASE: ${{ github.sha }}
        run: |
          # If flake.lock changed on main during the run (a manual update),
          # that one wins; don't clobber it with what we tested.
          if ! git diff --quiet "$BASE" HEAD -- flake.lock; then
            echo "::warning::flake.lock changed on main since $BASE, skipping commit"
            exit 0
          fi
          printf '%s\n' "$LOCK" > flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake update" -- flake.lock
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Close failure issue
        run: |
          .github/scripts/notify.sh close "Flake update failed" "Fixed: $RUN_URL"
          # The failed candidate is superseded by this lock.
          git push origin --delete flake-update 2>/dev/null || true

      # The push above doesn't trigger Check, so report the new lock's
      # warnings for main here.
      - name: Report warnings
        if: steps.commit.outputs.committed == 'true'
        env:
          WARNINGS: ${{ needs.check.outputs.warnings }}
        run: .github/scripts/report-warnings.sh <<<"$WARNINGS"

  notify:
    needs: [update, check, build, commit]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      actions: read # list which jobs failed
      contents: write # the flake-update branch
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      # The candidate lock otherwise only exists in this run. On a branch,
      # a fix (yours or the issue agent's, whose branch starts from it) is
      # made and tested against the lock that actually failed, and merging
      # it lands the update and the fix together.
      - name: Push the candidate lock
        id: candidate
        if: needs.update.outputs.changed == 'true'
        env:
          LOCK: ${{ needs.update.outputs.lock }}
        run: |
          printf '%s\n' "$LOCK" > flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake update" -- flake.lock
          git push --force origin HEAD:refs/heads/flake-update
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          failed=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)"')
          candidate=""
          if [ -n "$CANDIDATE" ]; then
            # The marker tells the issue agent to start from the branch.
            candidate=$(printf '\n%s\n\n<!-- agent-base: flake-update -->\n' \
              "The updated flake.lock is on the \`flake-update\` branch ($CANDIDATE); fix on top of it.")
          fi
          issue=$(printf 'Run: %s\n\nFailed jobs:\n%s\n%s\n' "$RUN_URL" "$failed" "$candidate" |
            .github/scripts/notify.sh issue "Flake update failed")
          .github/scripts/notify.sh telegram "$(printf '❌ Flake update failed for %s\nRun: %s\nIssue: %s' "$GH_REPO" "$RUN_URL" "$issue")"
